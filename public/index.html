<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jeu musical — serveur</title>
<style>
  :root {
    --bg: #08060c;
    --panel: #14101c;
    --line: #2a2438;
    --text: #e9e4f2;
    --muted: #8d84a3;
    --accent: #ff5fa3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  canvas { position: fixed; inset: 0; }
  .panel {
    position: fixed; left: 16px; top: 16px; z-index: 20;
    background: rgba(20, 16, 28, 0.9);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    max-width: 260px;
  }
  .panel h1 { font-size: 15px; font-weight: 500; margin: 0 0 6px; }
  .panel p { font-size: 12px; color: var(--muted); margin: 4px 0; }
  #status { font-size: 12px; margin-top: 6px; }
  #status.ok { color: #7ee08a; }
  #status.off { color: #ff8a8a; }
  #invite-row { display: flex; gap: 6px; margin-top: 8px; }
  #invite-link {
    flex: 1; background: #1d1829; border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 11px;
  }
  #copy-btn {
    background: var(--accent); border: none; color: #2a0b18;
    font-weight: 600; font-size: 11px; border-radius: 6px; padding: 0 10px; cursor: pointer;
  }
  #decor-select {
    width: 100%; margin-top: 8px; background: #1d1829; border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 12px;
  }

  #youtube-box {
    position: fixed; right: 16px; top: 16px; z-index: 20;
    background: rgba(20, 16, 28, 0.9);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    width: 280px;
  }
  #youtube-box h2 { font-size: 13px; font-weight: 500; margin: 0 0 8px; }
  #youtube-row { display: flex; gap: 6px; }
  #youtube-input {
    flex: 1; background: #1d1829; border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 12px;
  }
  #youtube-launch-btn {
    background: #ff0033; border: none; color: #fff;
    font-weight: 600; font-size: 12px; border-radius: 6px; padding: 0 12px; cursor: pointer;
  }
  #youtube-now-playing { margin-top: 8px; font-size: 11px; color: var(--muted); }
  #youtube-player-wrap {
    margin-top: 8px; width: 100%; aspect-ratio: 16/9;
    border-radius: 8px; overflow: hidden; background: #000;
  }
  #youtube-controls { display: flex; gap: 6px; margin-top: 8px; }
  #youtube-controls .btn { flex: 1; text-align: center; font-size: 11px; padding: 6px 4px; }

  #bottom-bars {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 20; display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  .bar { display: flex; gap: 8px; background: rgba(20,16,28,0.9); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .btn {
    background: #1d1829; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 8px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .btn.active { background: var(--accent); color: #2a0b18; font-weight: 600; border-color: var(--accent); }

  #chat-wrap {
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    width: 260px; display: flex; flex-direction: column; gap: 6px;
  }
  #chat-log {
    max-height: 160px; overflow-y: auto;
    background: rgba(20,16,28,0.85); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px; font-size: 12px;
  }
  #chat-log div { margin-bottom: 4px; }
  #chat-row { display: flex; gap: 6px; }
  #chat-input {
    flex: 1; background: #1d1829; border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 12px;
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="panel">
  <h1>Jeu musical — test serveur</h1>
  <p>Ouvre cette page dans plusieurs onglets : chaque joueur doit voir les autres bouger, danser et changer d'accessoire en direct.</p>
  <p>Déplacement : flèches du clavier</p>
  <div id="status" class="off">Connexion...</div>
  <div id="invite-row">
    <input id="invite-link" readonly value="">
    <button id="copy-btn">Copier</button>
  </div>
  <select id="decor-select">
    <option value="mainstage">Mainstage festival</option>
    <option value="nightclub">Boîte de nuit</option>
    <option value="wheatfield">Champ de blé</option>
  </select>
</div>

<div id="youtube-box">
  <h2>Musique (YouTube)</h2>
  <div id="youtube-row">
    <input id="youtube-input" placeholder="Colle un lien YouTube...">
    <button id="youtube-launch-btn">Lancer</button>
  </div>
  <div id="youtube-now-playing">Aucune vidéo en cours.</div>
  <div id="youtube-player-wrap"><div id="youtube-player"></div></div>
  <div id="youtube-controls">
    <div class="btn" id="yt-back-btn">⏪ -10s</div>
    <div class="btn" id="yt-pause-btn">⏸ Pause</div>
    <div class="btn" id="yt-forward-btn">+10s ⏩</div>
  </div>
</div>

<div id="bottom-bars">
  <div class="bar" id="poseBar"></div>
  <div class="bar" id="accessoryBar"></div>
</div>

<div id="chat-wrap">
  <div id="chat-log"></div>
  <div id="chat-row">
    <input id="chat-input" placeholder="Message..." maxlength="140">
    <button class="btn" id="chat-send">Envoyer</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const statusEl = document.getElementById('status');
const socket = io();

let selfId = null;
let players = {};
let currentDecor = 'mainstage';

const urlParams = new URLSearchParams(window.location.search);
const requestedRoom = urlParams.get('room') || '';

socket.on('connect', () => {
  socket.emit('join-room', requestedRoom);
  syncClock();
});
socket.on('disconnect', () => { statusEl.textContent = 'Déconnecté'; statusEl.className = 'off'; });

socket.on('room-state', (state) => {
  selfId = state.selfId;
  players = state.players;
  currentDecor = state.decor || 'mainstage';
  document.getElementById('decor-select').value = currentDecor;

  statusEl.textContent = 'Connecté — salle ' + state.roomId;
  statusEl.className = 'ok';

  const inviteUrl = window.location.origin + window.location.pathname + '?room=' + state.roomId;
  window.history.replaceState({}, '', inviteUrl);
  document.getElementById('invite-link').value = inviteUrl;

  if (state.currentVideo) {
    applyVideoState(state.currentVideo);
  }
});
socket.on('player-joined', ({ id, player }) => { players[id] = player; });
socket.on('player-left', ({ id }) => { delete players[id]; });
socket.on('player-moved', ({ id, x, y }) => { if (players[id]) { players[id].x = x; players[id].y = y; } });
socket.on('player-posed', ({ id, pose }) => { if (players[id]) players[id].pose = pose; });
socket.on('player-accessory', ({ id, accessory }) => { if (players[id]) players[id].accessory = accessory; });
socket.on('decor-changed', (decor) => {
  currentDecor = decor;
  document.getElementById('decor-select').value = decor;
});

document.getElementById('decor-select').addEventListener('change', (e) => {
  socket.emit('decor', e.target.value);
});

// --- poses et accessoires ---
const poses = ['idle', 'hands_up', 'jump', 'clap', 'dance1', 'dance2'];
const poseLabels = { idle: 'Repos', hands_up: 'Mains en l\u2019air', jump: 'Saute', clap: 'Applaudit', dance1: 'Danse 1', dance2: 'Danse 2' };
const poseBar = document.getElementById('poseBar');
poses.forEach(p => {
  const btn = document.createElement('div');
  btn.className = 'btn' + (p === 'idle' ? ' active' : '');
  btn.textContent = poseLabels[p];
  btn.addEventListener('click', () => {
    socket.emit('pose', p);
    poseBar.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
  poseBar.appendChild(btn);
});

const accessories = [
  { id: 'none', label: 'Aucun' },
  { id: 'cap', label: 'Casquette' },
  { id: 'hat', label: 'Chapeau' },
  { id: 'buoy', label: 'Bouée' },
  { id: 'costume', label: 'Costume' }
];
const accessoryBar = document.getElementById('accessoryBar');
accessories.forEach(a => {
  const btn = document.createElement('div');
  btn.className = 'btn' + (a.id === 'none' ? ' active' : '');
  btn.textContent = a.label;
  btn.addEventListener('click', () => {
    socket.emit('accessory', a.id);
    accessoryBar.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
  accessoryBar.appendChild(btn);
});

document.getElementById('copy-btn').addEventListener('click', () => {
  const input = document.getElementById('invite-link');
  input.select();
  navigator.clipboard.writeText(input.value).catch(() => {});
});

// --- déplacement ---
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });
let myX = 0.5, myY = 0.6;
function updateMovement() {
  const speed = 0.006;
  if (keys['ArrowLeft']) myX -= speed;
  if (keys['ArrowRight']) myX += speed;
  if (keys['ArrowUp']) myY -= speed;
  if (keys['ArrowDown']) myY += speed;
  myX = Math.max(0.05, Math.min(0.95, myX));
  myY = Math.max(0.15, Math.min(0.9, myY));
  if (selfId && players[selfId]) { players[selfId].x = myX; players[selfId].y = myY; }
  socket.emit('move', { x: myX, y: myY });
}
setInterval(updateMovement, 50);

// --- rendu du décor ---
const decorThemes = {
  mainstage: { sky1: '#241a33', sky2: '#08060c', stage: '#171223', accent: 'rgba(255,95,163,0.5)' },
  nightclub: { sky1: '#1a1024', sky2: '#040308', stage: '#0d0a14', accent: 'rgba(120,90,255,0.5)' },
  wheatfield: { sky1: '#3a2f1a', sky2: '#120e08', stage: '#2b2312', accent: 'rgba(255,200,90,0.5)' }
};
function drawBackground() {
  const theme = decorThemes[currentDecor] || decorThemes.mainstage;
  const grad = ctx.createRadialGradient(W/2, H*0.2, 50, W/2, H*0.2, W*0.75);
  grad.addColorStop(0, theme.sky1);
  grad.addColorStop(1, theme.sky2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = theme.stage;
  ctx.fillRect(W * 0.24, H * 0.05, W * 0.52, H * 0.13);
  ctx.fillStyle = theme.accent;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.arc(W * 0.30 + i * (W * 0.4 / 5), H * 0.11, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// avatar vu de dos, style détaillé (grosse tête, corps "chunky", accessoires)
function drawPlayer(p, isMe, t) {
  const cx = p.x * W, cy = p.y * H;
  const scale = isMe ? 1.05 : 0.9;
  const move = p.pose || 'idle';
  const accessory = p.accessory || 'none';
  const shirtColor = p.color || '#8d84a3';
  const pantsColor = '#2a2438';

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  let armAngle = 0.3, armLift = 0, bob = 0, sway = 0, legSpread = 6;
  if (move === 'idle') { bob = Math.sin(t / 600) * 2; sway = Math.sin(t / 800) * 2; }
  else if (move === 'hands_up') { armLift = 1; bob = Math.abs(Math.sin(t / 260)) * 7; }
  else if (move === 'jump') { armLift = 0.6; bob = Math.abs(Math.sin(t / 200)) * 18; legSpread = 10; }
  else if (move === 'clap') { armLift = 0.75; armAngle = 1.0; bob = Math.abs(Math.sin(t / 240)) * 5; }
  else if (move === 'dance1') { sway = Math.sin(t / 300) * 18; armAngle = 0.5 + Math.sin(t / 300) * 0.4; bob = Math.abs(Math.sin(t / 300)) * 6; }
  else if (move === 'dance2') { sway = Math.sin(t / 200) * 10; armLift = (Math.sin(t / 200) + 1) / 2; bob = Math.abs(Math.cos(t / 200)) * 10; legSpread = 7 + Math.sin(t / 200) * 3; }

  ctx.translate(sway, -bob);

  ctx.save();
  ctx.translate(-sway, bob);
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.beginPath();
  ctx.ellipse(0, 46, 20, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = pantsColor;
  roundRect(ctx, -13, 16, 10, 20, 4);
  roundRect(ctx, 3, 16, 10, 20, 4);
  ctx.fill();
  ctx.fillStyle = '#1c1626';
  roundRect(ctx, -14, 33, 12, 7, 3);
  roundRect(ctx, 2, 33, 12, 7, 3);
  ctx.fill();

  ctx.fillStyle = shirtColor;
  roundRect(ctx, -17, -18, 34, 38, 12);
  ctx.fill();

  if (accessory === 'costume') {
    ctx.strokeStyle = '#ff5fa3';
    ctx.lineWidth = 2;
    roundRect(ctx, -17, -18, 34, 38, 12);
    ctx.stroke();
  }
  if (accessory === 'buoy') {
    ctx.strokeStyle = '#ff8a3d';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.ellipse(0, 10, 22, 10, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = '#ffd08a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 10, 22, 10, 0, 0.3, 1.2);
    ctx.ellipse(0, 10, 22, 10, 0, 2.0, 2.9);
    ctx.stroke();
  }

  const shoulderY = -10, armLen = 24;
  const angle = armAngle + (Math.PI / 2 + 0.2 - armAngle) * armLift;
  const lx = -16 - Math.cos(angle) * armLen, ly = shoulderY - Math.sin(angle) * armLen;
  let rx = 16 + Math.cos(angle) * armLen, ry = shoulderY - Math.sin(angle) * armLen;
  if (move === 'clap') { rx = lx + 6; ry = ly; }

  ctx.strokeStyle = shirtColor;
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-16, shoulderY); ctx.lineTo(lx, ly);
  ctx.moveTo(16, shoulderY); ctx.lineTo(rx, ry);
  ctx.stroke();

  const skinTone = '#f0cca3';
  ctx.fillStyle = skinTone;
  ctx.beginPath();
  ctx.arc(lx, ly, 6.5, 0, Math.PI * 2);
  ctx.arc(rx, ry, 6.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = skinTone;
  ctx.beginPath();
  ctx.arc(0, -32, 17, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#241c30';
  ctx.beginPath();
  ctx.arc(0, -34, 17.6, Math.PI * 0.02, Math.PI * 0.98);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = skinTone;
  ctx.beginPath();
  ctx.arc(-16, -28, 3.2, 0, Math.PI * 2);
  ctx.arc(16, -28, 3.2, 0, Math.PI * 2);
  ctx.fill();

  if (accessory === 'cap') {
    ctx.fillStyle = '#2f9e6b';
    ctx.beginPath();
    ctx.arc(0, -35, 18.2, Math.PI * 0.85, Math.PI * 2.15);
    ctx.fill();
    ctx.fillRect(-6, -19, 12, 5);
  } else if (accessory === 'hat') {
    ctx.fillStyle = '#caa25a';
    ctx.beginPath();
    ctx.ellipse(0, -40, 25, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -47, 12, Math.PI, Math.PI * 2);
    ctx.fill();
  }

  if (isMe) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, -32, 23, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();

  // nom au-dessus
  ctx.fillStyle = '#e9e4f2';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(p.name || '', cx, cy - 78 * scale);
}

function loop(t) {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  Object.entries(players).forEach(([id, p]) => drawPlayer(p, id === selfId, t));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// --- chat ---
const chatLog = document.getElementById('chat-log');
const chatInput = document.getElementById('chat-input');
document.getElementById('chat-send').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
function sendChat() {
  const text = chatInput.value.trim();
  if (!text) return;
  socket.emit('chat', text);
  chatInput.value = '';
}
socket.on('chat-message', ({ name, color, text }) => {
  const line = document.createElement('div');
  line.innerHTML = `<b style="color:${color}">${escapeHtml(name)}</b>: ${escapeHtml(text)}`;
  chatLog.appendChild(line);
  chatLog.scrollTop = chatLog.scrollHeight;
});
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- YouTube (lecture synchronisée, sans aucun compte requis) ---
let ytPlayer = null;
let ytPlayerReady = false;
let pendingVideo = null;       // dernier état reçu avant que le lecteur soit prêt
let currentLoadedVideoId = null;
let currentVideoState = null;  // dernier état connu (paused, positionSec, anchorAt, videoId)

// --- correction d'horloge (pour un top départ fiable même avec une heure système décalée) ---
let clockOffset = 0; // à ajouter à Date.now() pour estimer l'heure du serveur
function serverNow() { return Date.now() + clockOffset; }

function syncClock(attemptsLeft = 3) {
  const t0 = Date.now();
  socket.emit('time-sync', null, (serverTime) => {
    const rtt = Date.now() - t0;
    clockOffset = (serverTime + rtt / 2) - Date.now();
    if (attemptsLeft > 1) setTimeout(() => syncClock(attemptsLeft - 1), 300);
  });
}

function extractYoutubeId(url) {
  const patterns = [/(?:youtube\.com\/watch\?v=|youtube\.com\/shorts\/|youtu\.be\/)([\w-]{11})/];
  for (const re of patterns) {
    const m = url.match(re);
    if (m) return m[1];
  }
  return null;
}

document.getElementById('youtube-launch-btn').addEventListener('click', () => {
  const url = document.getElementById('youtube-input').value.trim();
  const videoId = extractYoutubeId(url);
  if (!videoId) {
    alert('Lien YouTube non reconnu. Colle un lien du type https://www.youtube.com/watch?v=... ou https://youtu.be/...');
    return;
  }
  socket.emit('play-video', { videoId, title: url });
  socket.emit('chat', '📺 a lancé une vidéo YouTube');
});

function currentActualPosition(cv) {
  if (!cv) return 0;
  return cv.paused ? cv.positionSec : cv.positionSec + Math.max(0, serverNow() - cv.anchorAt) / 1000;
}

document.getElementById('yt-pause-btn').addEventListener('click', () => {
  if (!currentVideoState) return;
  const pos = currentActualPosition(currentVideoState);
  const goingToPause = !currentVideoState.paused;
  socket.emit('video-control', { action: goingToPause ? 'pause' : 'play', positionSec: pos });
});
document.getElementById('yt-back-btn').addEventListener('click', () => {
  if (!currentVideoState) return;
  const pos = Math.max(0, currentActualPosition(currentVideoState) - 10);
  socket.emit('video-control', { action: 'seek', positionSec: pos });
});
document.getElementById('yt-forward-btn').addEventListener('click', () => {
  if (!currentVideoState) return;
  const pos = currentActualPosition(currentVideoState) + 10;
  socket.emit('video-control', { action: 'seek', positionSec: pos });
});

socket.on('video-state', (cv) => applyVideoState(cv));

// Applique un état de lecture reçu du serveur : charge la vidéo si besoin,
// se cale sur la bonne position, et joue ou met en pause selon le cas.
// Recalcule toujours tout au moment de l'exécution (jamais figé à l'avance),
// ce qui évite les décalages si le lecteur n'était pas encore prêt.
function applyVideoState(cv) {
  currentVideoState = cv;
  document.getElementById('youtube-now-playing').textContent =
    (cv.paused ? '⏸ En pause : ' : '▶ En cours : ') + (cv.title || cv.videoId);
  document.getElementById('yt-pause-btn').textContent = cv.paused ? '▶ Lecture' : '⏸ Pause';

  const delay = cv.anchorAt - serverNow(); // positif seulement pour un tout nouveau morceau (top départ futur)

  const doApply = () => {
    if (!ytPlayerReady) { pendingVideo = cv; return; }
    const pos = Math.max(0, currentActualPosition(cv));
    const isNewVideo = cv.videoId !== currentLoadedVideoId;

    if (isNewVideo) {
      currentLoadedVideoId = cv.videoId;
      ytPlayer.loadVideoById({ videoId: cv.videoId, startSeconds: pos });
      if (cv.paused) setTimeout(() => ytPlayer.pauseVideo(), 400);
    } else {
      ytPlayer.seekTo(pos, true);
      if (cv.paused) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
    }
  };

  if (delay > 0) setTimeout(doApply, delay); else doApply();
}

window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player('youtube-player', {
    height: '100%', width: '100%',
    playerVars: { autoplay: 1, playsinline: 1, controls: 0 },
    events: {
      onReady: () => {
        ytPlayerReady = true;
        if (pendingVideo) {
          const cv = pendingVideo;
          pendingVideo = null;
          applyVideoState(cv); // recalcule tout depuis zéro, maintenant que le lecteur est prêt
        }
      }
    }
  });
};
const ytScript = document.createElement('script');
ytScript.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytScript);
</script>
</body>
</html>
