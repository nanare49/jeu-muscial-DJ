<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test synchro — serveur minimal</title>
<style>
  :root {
    --bg: #08060c;
    --panel: #14101c;
    --line: #2a2438;
    --text: #e9e4f2;
    --muted: #8d84a3;
    --accent: #ff5fa3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  canvas { position: fixed; inset: 0; }
  .panel {
    position: fixed; left: 16px; top: 16px; z-index: 20;
    background: rgba(20, 16, 28, 0.9);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    max-width: 260px;
  }
  .panel h1 { font-size: 15px; font-weight: 500; margin: 0 0 6px; }
  .panel p { font-size: 12px; color: var(--muted); margin: 4px 0; }
  #status { font-size: 12px; margin-top: 6px; }
  #status.ok { color: #7ee08a; }
  #status.off { color: #ff8a8a; }
  #invite-row { display: flex; gap: 6px; margin-top: 8px; }
  #invite-link {
    flex: 1; background: #1d1829; border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 11px;
  }
  #copy-btn {
    background: var(--accent); border: none; color: #2a0b18;
    font-weight: 600; font-size: 11px; border-radius: 6px; padding: 0 10px; cursor: pointer;
  }

  #youtube-box {
    position: fixed; right: 16px; top: 16px; z-index: 20;
    background: rgba(20, 16, 28, 0.9);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    width: 280px;
  }
  #youtube-box h2 { font-size: 13px; font-weight: 500; margin: 0 0 8px; }
  #youtube-row { display: flex; gap: 6px; }
  #youtube-input {
    flex: 1; background: #1d1829; border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 12px;
  }
  #youtube-launch-btn {
    background: #ff0033; border: none; color: #fff;
    font-weight: 600; font-size: 12px; border-radius: 6px; padding: 0 12px; cursor: pointer;
  }
  #youtube-now-playing {
    margin-top: 8px; font-size: 11px; color: var(--muted);
  }
  #youtube-player-wrap {
    margin-top: 8px; width: 100%; aspect-ratio: 16/9;
    border-radius: 8px; overflow: hidden; background: #000;
  }

  #controls {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 20;
    display: flex; gap: 8px;
  }
  .btn {
    background: #1d1829; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 8px 12px; font-size: 12px; cursor: pointer;
  }
  .btn.active { background: var(--accent); color: #2a0b18; font-weight: 600; border-color: var(--accent); }

  #chat-wrap {
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    width: 260px; display: flex; flex-direction: column; gap: 6px;
  }
  #chat-log {
    max-height: 160px; overflow-y: auto;
    background: rgba(20,16,28,0.85); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px; font-size: 12px;
  }
  #chat-log div { margin-bottom: 4px; }
  #chat-row { display: flex; gap: 6px; }
  #chat-input {
    flex: 1; background: #1d1829; border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 12px;
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="panel">
  <h1>Test de synchro — serveur minimal</h1>
  <p>Ouvre cette page dans plusieurs onglets ou fenêtres : chaque joueur doit voir les autres bouger et changer de pose en direct.</p>
  <p>Déplacement : flèches du clavier</p>
  <div id="status" class="off">Connexion...</div>
  <div id="invite-row">
    <input id="invite-link" readonly value="">
    <button id="copy-btn">Copier</button>
  </div>
</div>

<div id="controls"></div>

<div id="youtube-box">
  <h2>Musique (YouTube)</h2>
  <div id="youtube-row">
    <input id="youtube-input" placeholder="Colle un lien YouTube...">
    <button id="youtube-launch-btn">Lancer</button>
  </div>
  <div id="youtube-now-playing">Aucune vidéo en cours.</div>
  <div id="youtube-player-wrap"><div id="youtube-player"></div></div>
</div>

<div id="chat-wrap">
  <div id="chat-log"></div>
  <div id="chat-row">
    <input id="chat-input" placeholder="Message..." maxlength="140">
    <button class="btn" id="chat-send">Envoyer</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const statusEl = document.getElementById('status');
const socket = io();

let selfId = null;
let players = {};

const urlParams = new URLSearchParams(window.location.search);
const requestedRoom = urlParams.get('room') || '';

socket.on('connect', () => { socket.emit('join-room', requestedRoom); });
socket.on('disconnect', () => { statusEl.textContent = 'Déconnecté'; statusEl.className = 'off'; });

socket.on('room-state', (state) => {
  selfId = state.selfId;
  players = state.players;

  statusEl.textContent = 'Connecté — salle ' + state.roomId;
  statusEl.className = 'ok';

  const inviteUrl = window.location.origin + window.location.pathname + '?room=' + state.roomId;
  window.history.replaceState({}, '', inviteUrl);
  document.getElementById('invite-link').value = inviteUrl;

  if (state.currentVideo) {
    document.getElementById('youtube-now-playing').textContent = 'En cours : ' + (state.currentVideo.title || state.currentVideo.videoId);
    scheduleYoutubePlayback(state.currentVideo);
  }
});
socket.on('player-joined', ({ id, player }) => { players[id] = player; });
socket.on('player-left', ({ id }) => { delete players[id]; });
socket.on('player-moved', ({ id, x, y }) => { if (players[id]) { players[id].x = x; players[id].y = y; } });
socket.on('player-posed', ({ id, pose }) => { if (players[id]) players[id].pose = pose; });
socket.on('player-accessory', ({ id, accessory }) => { if (players[id]) players[id].accessory = accessory; });

const poses = ['idle', 'hands_up', 'jump', 'clap'];
const poseLabels = { idle: 'Repos', hands_up: 'Mains en l\u2019air', jump: 'Saute', clap: 'Applaudit' };
const controls = document.getElementById('controls');
poses.forEach(p => {
  const btn = document.createElement('div');
  btn.className = 'btn' + (p === 'idle' ? ' active' : '');
  btn.textContent = poseLabels[p];
  btn.addEventListener('click', () => {
    socket.emit('pose', p);
    controls.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
  controls.appendChild(btn);
});

document.getElementById('copy-btn').addEventListener('click', () => {
  const input = document.getElementById('invite-link');
  input.select();
  navigator.clipboard.writeText(input.value).catch(() => {});
});

// --- déplacement ---
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });
let myX = 0.5, myY = 0.6;
function updateMovement() {
  const speed = 0.006;
  if (keys['ArrowLeft']) myX -= speed;
  if (keys['ArrowRight']) myX += speed;
  if (keys['ArrowUp']) myY -= speed;
  if (keys['ArrowDown']) myY += speed;
  myX = Math.max(0.05, Math.min(0.95, myX));
  myY = Math.max(0.1, Math.min(0.9, myY));
  if (selfId && players[selfId]) { players[selfId].x = myX; players[selfId].y = myY; }
  socket.emit('move', { x: myX, y: myY });
}
setInterval(updateMovement, 50);

// --- rendu ---
function drawBackground() {
  const grad = ctx.createRadialGradient(W/2, H*0.3, 50, W/2, H*0.3, W*0.7);
  grad.addColorStop(0, '#241a33');
  grad.addColorStop(1, '#08060c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}
function drawPlayer(p, isMe) {
  const x = p.x * W, y = p.y * H;
  ctx.fillStyle = p.color || '#8d84a3';
  ctx.beginPath();
  ctx.arc(x, y, isMe ? 16 : 13, 0, Math.PI * 2);
  ctx.fill();
  if (isMe) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.fillStyle = '#e9e4f2';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText((p.name || '') + (p.pose && p.pose !== 'idle' ? ' · ' + p.pose : ''), x, y - 22);
}
function loop() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  Object.entries(players).forEach(([id, p]) => drawPlayer(p, id === selfId));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// --- chat ---
const chatLog = document.getElementById('chat-log');
const chatInput = document.getElementById('chat-input');
document.getElementById('chat-send').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
function sendChat() {
  const text = chatInput.value.trim();
  if (!text) return;
  socket.emit('chat', text);
  chatInput.value = '';
}
socket.on('chat-message', ({ name, color, text }) => {
  const line = document.createElement('div');
  line.innerHTML = `<b style="color:${color}">${escapeHtml(name)}</b>: ${escapeHtml(text)}`;
  chatLog.appendChild(line);
  chatLog.scrollTop = chatLog.scrollHeight;
});
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- YouTube (lecture synchronisée, sans aucun compte requis) ---
let ytPlayer = null;
let ytPlayerReady = false;
let pendingVideo = null; // vidéo à jouer dès que le lecteur est prêt

function extractYoutubeId(url) {
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtube\.com\/shorts\/|youtu\.be\/)([\w-]{11})/
  ];
  for (const re of patterns) {
    const m = url.match(re);
    if (m) return m[1];
  }
  return null;
}

document.getElementById('youtube-launch-btn').addEventListener('click', () => {
  const url = document.getElementById('youtube-input').value.trim();
  const videoId = extractYoutubeId(url);
  if (!videoId) {
    alert('Lien YouTube non reconnu. Colle un lien du type https://www.youtube.com/watch?v=... ou https://youtu.be/...');
    return;
  }
  socket.emit('play-video', { videoId, title: url });
  socket.emit('chat', '📺 a lancé une vidéo YouTube');
});

socket.on('play-video', (video) => {
  document.getElementById('youtube-now-playing').textContent = 'En cours : ' + (video.title || video.videoId);
  scheduleYoutubePlayback(video);
});

function scheduleYoutubePlayback(video) {
  const delay = Math.max(0, video.startAt - Date.now());
  const lateBySeconds = Math.max(0, (Date.now() - video.startAt) / 1000);

  const doPlay = () => {
    if (!ytPlayerReady) {
      pendingVideo = { videoId: video.videoId, startSeconds: lateBySeconds };
      return;
    }
    ytPlayer.loadVideoById({ videoId: video.videoId, startSeconds: lateBySeconds });
  };

  if (delay > 0) {
    setTimeout(doPlay, delay);
  } else {
    doPlay(); // on rejoint une vidéo déjà en cours
  }
}

// chargement de l'API YouTube IFrame
window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player('youtube-player', {
    height: '100%',
    width: '100%',
    playerVars: { autoplay: 1, playsinline: 1 },
    events: {
      onReady: () => {
        ytPlayerReady = true;
        if (pendingVideo) {
          ytPlayer.loadVideoById({ videoId: pendingVideo.videoId, startSeconds: pendingVideo.startSeconds });
          pendingVideo = null;
        }
      }
    }
  });
};
const ytScript = document.createElement('script');
ytScript.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytScript);
</script>
</body>
</html>
